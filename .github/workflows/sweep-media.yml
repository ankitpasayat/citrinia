name: sweep-media

# Deletes uploads that no peel references from the `media` Storage bucket: a
# picture attached in the composer and never posted, or one whose peel was
# composted before the app removed uploads on delete. Objects younger than an
# hour are left alone, since a composer may still be posting them.
#
# Same two repository secrets as drip.yml; the service role is what can delete
# from every user's folder. Neither is ever printed.
#
#   SUPABASE_URL               https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  the project's service_role key

on:
  schedule:
    - cron: "23 3 * * *" # daily, 03:23 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be deleted without deleting it"
        type: boolean
        default: false

concurrency:
  group: sweep-media
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step on purpose: the script is plain Node with no dependencies.
      - name: Sweep orphaned uploads
        run: node scripts/sweep-media.mjs --target live ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
